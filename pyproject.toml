[project]
name = "ismir2026-virtual-sim"
version = "0.1.0"
description = "ISMIR 2026 virtual platform creation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask==2.3.3",
    "frozen-flask",
    "markdown-it-py",
    "tqdm",
    "PyYAML",
    "tzlocal",
    "python-dotenv",
    "pytz",
    "python-dateutil",
    "gunicorn",
    "requests",
    "pandas>=2.0.3",
    "openpyxl>=3.1.5",
    "icalendar>=6.3.2",
    "ics>=0.7.3",
    "slack-sdk>=3.43.0",
    "gdown>=5.2,<6",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "matplotlib>=3.11.2",
    "prompt-toolkit>=3.0.53",
]

[project.optional-dependencies]
youtube = [
    "google-api-python-client>=2,<3",
    "google-auth-oauthlib>=1,<2",
    "evdev>=1.9",
]
dev = [
    "pytest",
]

[tool.ruff.lint]
ignore = ["I001", "TRY002", "C408"]
