<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LBD player</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0d1419; color: #eef3f5; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body.idle { cursor: none; }
    .layer { position: fixed; inset: 0; visibility: hidden; }
    .layer.shown { visibility: visible; }
    /* Hidden layers stay rendered under the timetable, so a poster is ready when its turn comes. */
    #poster, #video-layer { background: #fff; visibility: visible; }
    #video-layer { background: #000; opacity: 0; }
    #video-layer.shown { opacity: 1; }
    #poster iframe, #poster img { position: absolute; top: 0; left: 0; width: 100%; height: calc(100% - 7vh); border: 0; object-fit: contain; }
    #video { position: absolute; top: 0; left: 0; width: 100%; height: calc(100% - 7vh); background: #000; }
    .strip { position: absolute; left: 0; right: 0; bottom: 0; height: 7vh; display: flex; flex-direction: column; justify-content: center; padding: 0 2.5vw; background: #0d1419; font-size: 2.1vh; overflow: hidden; }
    .strip b { font-size: 2.6vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .strip span { color: #9fb1bb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #card, #timetable { background: #0d1419; padding: 5vh 4vw; z-index: 2; }
    #card { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    #card h1 { font-size: 6vh; margin: 0 0 2vh; }
    #card p { font-size: 3vh; color: #9fb1bb; margin: 0; }
    #timetable h1 { font-size: 4.6vh; margin: 0; }
    #timetable .sub { font-size: 2.4vh; color: #9fb1bb; margin: .6vh 0 3vh; }
    #rows { columns: 2; column-gap: 4vw; }
    .row { display: flex; gap: 1.4vw; break-inside: avoid; font-size: 2.3vh; padding: .8vh 0; }
    .row time { color: #5fc4b4; font-variant-numeric: tabular-nums; }
    .row div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row.up { font-weight: 700; color: #fff; }
    #hint { position: fixed; z-index: 3; right: 1.5vw; top: 1.5vh; padding: .6vh 1vw; background: #000a; border-radius: 6px; font-size: 1.7vh; color: #d7e1e6; transition: opacity .4s; }
    body.idle #hint { opacity: 0; }
  </style>
</head>
<body>
  <div class="layer" id="poster"></div>
  <div class="layer" id="video-layer">
    <video id="video" playsinline preload="auto" muted></video>
    <div class="strip" id="video-strip"></div>
  </div>
  <div class="layer" id="timetable"><h1 id="tt-title"></h1><div class="sub" id="tt-sub"></div><div id="rows"></div></div>
  <div class="layer shown" id="card"><h1 id="card-title">Loading…</h1><p id="card-text"></p></div>
  <div id="hint">F fullscreen · M sound: off</div>
  <script src="kit.js"></script>
  <script src="lbd-timeline.js"></script>
  <script>
    const screen_ = new URLSearchParams(location.search).get('screen') || '1';
    const TICK_MS = 250;
    const RELOAD_MS = 3000;
    const DRIFT_S = 1.2;
    const VISIBLE_ROWS = 34;  // two columns; the longest default plan has 33 plays
    const $ = (id) => document.getElementById(id);
    const video = $('video');
    let plan, timeline, prepared = '';

    const paperOf = (item) => plan.papers[item.uid] || { title: `LBD ${item.uid}`, authors: '' };
    const stripHtml = (item) => {
      const paper = paperOf(item);
      return `<b>${Kit.esc(paper.title)}</b><span>${Kit.esc(paper.authors)}</span>`;
    };
    const atClock = (seconds) => Kit.clock(plan.start_ms + seconds * 1000, plan.timezone);

    function prepare(item) {
      const media = plan.media[item.uid] || {};
      // Not the revision: an edit further down the list must not reload what is on the wall.
      const key = [item.index, item.uid, media.video, media.poster, plan.problems[item.uid], plan.poster_s > 0].join();
      if (prepared === key) return;
      prepared = key;
      const unplayable = plan.problems[item.uid] || !media.video;
      const strip = `<div class="strip">${stripHtml(item)}</div>`;
      const poster = media.poster && plan.poster_s + (unplayable ? 1 : 0)
        ? (media.poster.endsWith('.pdf')
          ? `<iframe src="${media.poster}#toolbar=0&navpanes=0&scrollbar=0&view=Fit"></iframe>`
          : `<img src="${media.poster}" alt="">`)
        : '';
      $('poster').innerHTML = poster + strip;
      $('video-strip').innerHTML = stripHtml(item);
      if (unplayable) {
        video.removeAttribute('src');
        video.load();
      } else {
        video.src = media.video;
        video.load();
      }
    }

    function drawTimetable(from) {
      $('tt-title').textContent = `LBD screen ${plan.screen}: ${plan.name}`;
      $('tt-sub').textContent = plan.theme;
      const rows = timeline.items.slice(from, from + VISIBLE_ROWS);
      $('rows').innerHTML = rows.map((item, index) => `<div class="row${index ? '' : ' up'}">
        <time>${atClock(item.start)}</time><div>${Kit.esc(paperOf(item).title)}</div></div>`).join('');
    }

    function show(layer) {
      ['card', 'timetable'].forEach((id) => $(id).classList.toggle('shown', id === layer));
      $('video-layer').classList.toggle('shown', layer === 'video-layer');
    }

    function syncVideo(position) {
      const hasVideo = Boolean(video.getAttribute('src'));
      if (!hasVideo) {
        $('video-layer').classList.remove('shown');  // the poster stays up instead
        video.pause();
        return;
      }
      if (video.seeking) return;
      if (Math.abs(video.currentTime - position.offset) > DRIFT_S && position.offset < (video.duration || Infinity)) {
        video.currentTime = position.offset;
      }
      if (video.paused && !video.ended) video.play().catch(() => {});
    }

    function tick() {
      const position = Timeline.locate(timeline, (Date.now() - plan.start_ms) / 1000);
      if (position.phase === 'before') {
        prepare(position.item);
        const wait = Math.ceil(-position.offset);
        drawTimetable(0);
        show('timetable');
        $('tt-sub').textContent = `Starts at ${Kit.clock(plan.start_ms, plan.timezone)}, in ${Kit.duration(wait)}`;
        return;
      }
      if (position.phase === 'done') {
        video.pause();
        $('card-title').textContent = `LBD screen ${plan.screen}: ${plan.name}`;
        $('card-text').textContent = 'All videos have played. Thank you!';
        show('card');
        return;
      }
      const { item, phase } = position;
      prepare(item);
      if (phase === 'timetable') {
        drawTimetable(item.index);
        show('timetable');
      } else if (phase === 'poster') {
        show('poster');
      } else {
        show('video-layer');
        syncVideo(position);
        return;
      }
      if (!video.paused) video.pause();
      if (video.currentTime) video.currentTime = 0;
    }

    async function reload() {
      plan = await Kit.get(`/api/lbd/${screen_}`);
      timeline = Timeline.build(plan);
    }

    function setHint() {
      $('hint').textContent = `F fullscreen · M sound: ${video.muted ? 'off' : 'on'}`;
    }

    let idleTimer;
    function wake() {
      document.body.classList.remove('idle');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => document.body.classList.add('idle'), 4000);
    }

    document.addEventListener('mousemove', wake);
    document.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      if (key === 'f') {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen();
      } else if (key === 'm') {
        video.muted = !video.muted;
        localStorage.setItem('lbd-sound', video.muted ? 'off' : 'on');
        setHint();
        wake();
      }
    });
    document.addEventListener('dblclick', () => document.documentElement.requestFullscreen());

    (async () => {
      video.muted = localStorage.getItem('lbd-sound') !== 'on';
      setHint();
      wake();
      await reload();
      setInterval(tick, TICK_MS);
      setInterval(() => reload().catch(() => {}), RELOAD_MS);
      if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {});
    })();
  </script>
</body>
</html>
