# Drafted by GPT-5

name: Refresh website

on:
  workflow_dispatch:

  workflow_call:
    inputs:
      mockup:
        description: Refresh the mockup version
        required: false
        default: false
        type: boolean
    secrets:
      ZOOM_REDIRECT_ACCESS_TOKEN:
        required: true
      PAPERS_SHEET_URL:
        required: false
      SESSION_ASSIGNMENT_SHEET_URL:
        required: false
      EVENTS_SHEET_URL:
        required: false
      INDUSTRY_SHEET_URL:
        required: false
      MUSIC_SHEET_URL:
        required: false
      LBDS_SHEET_URL:
        required: false
      LBDS_GROUPING:
        required: false
      LIVE_OVERVIEW_ADMIN_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh artifacts
    runs-on: ubuntu-latest
    env:
      ZOOM_REDIRECT_ACCESS_TOKEN: ${{ secrets.ZOOM_REDIRECT_ACCESS_TOKEN }}
      PAPERS_SHEET_URL: ${{ secrets.PAPERS_SHEET_URL}}
      SESSION_ASSIGNMENT_SHEET_URL: ${{ secrets.SESSION_ASSIGNMENT_SHEET_URL}}
      EVENTS_SHEET_URL: ${{ secrets.EVENTS_SHEET_URL}}
      INDUSTRY_SHEET_URL: ${{ secrets.INDUSTRY_SHEET_URL}}
      MUSIC_SHEET_URL: ${{ secrets.MUSIC_SHEET_URL}}
      LBDS_SHEET_URL: ${{ secrets.LBDS_SHEET_URL}}
      LBDS_GROUPING: ${{ secrets.LBDS_GROUPING}}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Pull data
        if: ${{ !inputs.mockup }}
        run: uv run python pull_from_google_sheet.py

      - name: Pull mockup data
        if: ${{ inputs.mockup }}
        run: uv run python pull_from_google_sheet.py --mockup

      # Caches are immutable, so each run saves under a new key and restores
      # the newest one via the prefix.
      - name: Restore thumbnail cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: .cache/drive_thumbnails
          key: drive-thumbnails-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: drive-thumbnails-

      - name: Download paper thumbnails
        run: uv run python scripts/download_paper_thumbnails.py ${{ inputs.mockup && '--mockup' || '' }}

      # always(): keep partial progress even if the download or a later step fails.
      - name: Save thumbnail cache
        if: ${{ always() }}
        uses: actions/cache/save@v6.1.0
        with:
          path: .cache/drive_thumbnails
          key: drive-thumbnails-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build website
        if: ${{ !inputs.mockup }}
        run: uv run python main.py --build

      - name: Build mockup website
        if: ${{ inputs.mockup }}
        run: uv run python main.py --mockup --build

      # Sheet problems only produce warnings; a Live Overview failure never blocks miniconf.
      # The admin key is exposed to this step only; mockup runs never sync the backend.
      - name: Build Live Overview
        continue-on-error: true
        working-directory: live_overview
        env:
          LIVE_OVERVIEW_ADMIN_KEY: ${{ secrets.LIVE_OVERVIEW_ADMIN_KEY }}
        run: |
          bash install.sh
          bash build.sh ${{ inputs.mockup && '--mockup' || '' }}

      - name: Merge Live Overview
        run: |
          if [ -f live_overview/build/live.html ]; then cp -r live_overview/build/. build/; fi

      # Re-freezes paper data from the sheets pulled above, so the lounge follows every refresh.
      # Its backend (Cloudflare Worker) is deployed separately and needs no data, so no secrets here.
      # Like Live Overview, a failure here never blocks miniconf.
      - name: Build Pre-Conference Lounge
        continue-on-error: true
        working-directory: preconf
        run: |
          bash install.sh
          bash build.sh ${{ inputs.mockup && '--mockup' || '' }}

      - name: Merge Pre-Conference Lounge
        run: |
          if [ -f preconf/build/lounge.html ]; then cp -r preconf/build/. build/; fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build

  deploy:
    name: Deploy website
    needs: refresh
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
