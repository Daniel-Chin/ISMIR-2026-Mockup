# Drafted by GPT-5

name: Refresh website mockup

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Guards against accidentally deploying the mockup to the prod site.
  ensure-mockup-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless this is the mockup repo
        env:
          REPO: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [ "$REPO" != "https://github.com/Daniel-Chin/ISMIR2026-Kit-mockup" ]; then
            echo "::error::Refusing to deploy the mockup from $REPO."
            exit 1
          fi

  refresh-mockup:
    needs: ensure-mockup-repo
    uses: ./.github/workflows/refresh-website.yml
    with:
      mockup: true
    secrets:
      ZOOM_REDIRECT_ACCESS_TOKEN: ${{ secrets.ZOOM_REDIRECT_ACCESS_TOKEN }}
