<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LBD poster screen</title>
  <style>
    /* The look of the LBD video screens: white, ink, and the logo's gold. */
    :root { --gold: #b47500; --gold-light: #f8c44f; --ink: #161616; --soft: #5b5b5b; --page: #f9fafb; }
    html, body { margin: 0; height: 100%; background: var(--page); color: var(--ink); overflow: hidden;
      font-family: Poppins, "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
    body.idle { cursor: none; }
    .layer { position: fixed; inset: 0; visibility: hidden; display: flex; flex-direction: column; }
    .layer.shown { visibility: visible; }
    .logo { flex: none; mix-blend-mode: multiply; }  /* the logo file has a white background */
    .eyebrow { font-size: 1.9vh; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }

    /* The poster takes the screen's height, and the column on its right the width it leaves: which poster,
       how long it has shown, whose it is, its Slack channels, and what comes next. */
    #show { flex-direction: row; }
    .side { position: relative; flex: none; width: 21vw; display: flex; flex-direction: column; gap: 1.6vh; padding: 3vh 1.6vw 2.6vh;
      box-sizing: border-box; background: var(--page); border-left: 1px solid #e8e8e8; overflow: hidden; }
    .side .logo { height: 6vh; align-self: flex-start; }
    .side .eyebrow { font-size: 1.6vh; }
    .mark { display: flex; align-items: baseline; flex-wrap: wrap; gap: .4em .6em; }
    .mark .kind { padding: .35vh .7vw; border-radius: 99px; background: var(--gold); color: #fff; font-size: 1.5vh;
      font-weight: 700; letter-spacing: .14em; }
    .mark .code { font-size: 3.4vh; font-weight: 800; letter-spacing: .03em; }
    .mark .time { width: 100%; font-size: 2.2vh; font-weight: 600; color: var(--gold); font-variant-numeric: tabular-nums; }
    .side h1 { margin: 0; font-size: 2.5vh; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
    .side .authors { margin-top: -.6vh; font-size: 1.7vh; line-height: 1.4; color: var(--soft);
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .channels { display: flex; gap: .8vw; margin-top: auto; }
    .qr { flex: 1; min-width: 0; padding: 1vh .7vw .9vh; border-radius: 1.2vh; background: #fff; border-top: .5vh solid var(--gold);
      box-shadow: 0 .6vh 1.8vh #0000001a; text-align: center; }
    .qr img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; object-position: top; }  /* drops the printed name */
    .qr b { display: block; margin-top: .4vh; font-size: 1.15vh; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
    .qr span { display: block; margin-top: .2vh; font-size: 1.2vh; font-weight: 600; overflow-wrap: anywhere; }
    .next { padding-top: 1.4vh; border-top: 1px solid #e8e8e8; font-size: 1.7vh; line-height: 1.35; }
    .next b { display: block; margin-bottom: .3vh; font-size: 1.4vh; letter-spacing: .14em; color: var(--gold); }
    .next div { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .progress { position: absolute; left: 0; bottom: 0; height: .6vh; width: 100%; background: var(--gold-light);
      transform-origin: left; transform: scaleX(var(--done, 0)); }

    /* Two slots take turns: the next poster loads in the hidden one, then they cross-fade. */
    .stage { position: relative; flex: 1; min-height: 0; background: #fff; }
    .slot { position: absolute; inset: 0; opacity: 0; transition: opacity .8s ease; }
    .slot.on { opacity: 1; }
    .slot canvas, .slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    .fallback { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 10vw; text-align: center; }
    .fallback h2 { font-size: 5vh; margin: 0 0 2vh; }
    .fallback p { font-size: 2.6vh; color: var(--soft); margin: 0; }

    /* Before the start: the countdown and this screen's posters, by group. */
    #timetable { padding: 4vh 4vw 3vh; z-index: 2; background: var(--page); }
    .top { display: flex; align-items: center; gap: 2vw; padding-bottom: 2vh; margin-bottom: 2vh; border-bottom: .35vh solid var(--gold); }
    .top .logo { height: 9vh; }
    #tt-title { font-size: 4vh; font-weight: 800; margin: .3vh 0; line-height: 1.15; }
    #tt-sub { font-size: 2.3vh; color: var(--gold); font-variant-numeric: tabular-nums; }
    #rows { flex: 1; min-height: 0; overflow: hidden; }
    .group { margin-bottom: .6em; }
    .group h2 { margin: 0 0 .35em; font-size: .8em; font-weight: 700; color: var(--ink); }
    .chips { display: flex; flex-wrap: wrap; gap: .3em .35em; }
    .chip { padding: .25em .5em; border-radius: .3em; background: #fff; border-left: .4vh solid #e6cf9f; font-size: .9em;
      font-weight: 600; font-variant-numeric: tabular-nums; box-shadow: 0 .1vh .3vh #0000000d; }
    .chip time { margin-right: .5em; color: var(--gold); font-weight: 700; }

    #card { align-items: center; justify-content: center; text-align: center; background: var(--page); z-index: 2; }
    #card .logo { height: 16vh; margin-bottom: 3.5vh; }
    #card .eyebrow { font-size: 2.4vh; margin-bottom: 1.6vh; }
    #card h1 { max-width: 80vw; font-size: 5vh; line-height: 1.2; margin: 0 0 2vh; }
    #card p { font-size: 3vh; color: var(--soft); margin: 0; }
    #hint { position: fixed; z-index: 4; right: 1.5vw; bottom: 1.5vh; padding: .6vh 1vw; background: #161616cc; border-radius: 99px;
      font-size: 1.7vh; color: #fff; transition: opacity .4s; }
    body.idle #hint { opacity: 0; }
  </style>
</head>
<body>
  <div class="layer shown" id="show">
    <div class="stage"><div class="slot"></div><div class="slot"></div></div>
    <aside class="side">
      <img class="logo" src="logo.png" alt="ISMIR 2026">
      <div class="eyebrow">Late-Breaking / Demo</div>
      <div class="mark"><span class="kind">POSTER</span><span class="code" id="code"></span><span class="time" id="time"></span></div>
      <h1 id="title"></h1>
      <div class="authors" id="authors"></div>
      <div class="channels" id="channels"></div>
      <div class="next" id="next"></div>
      <i class="progress"></i>
    </aside>
  </div>
  <div class="layer" id="timetable">
    <div class="top">
      <img class="logo" src="logo.png" alt="ISMIR 2026">
      <div><div class="eyebrow">Late-Breaking / Demo · Posters</div><h1 id="tt-title"></h1><div id="tt-sub"></div></div>
    </div>
    <div id="rows"></div>
  </div>
  <div class="layer shown" id="card"><img class="logo" src="logo.png" alt="ISMIR 2026">
    <div class="eyebrow">Late-Breaking / Demo · Posters</div><h1 id="card-title">Loading…</h1><p id="card-text"></p></div>
  <div id="hint">F fullscreen</div>
  <script src="kit.js"></script>
  <script type="module">
    import * as pdfjs from './vendor/pdfjs/pdf.min.mjs';
    pdfjs.GlobalWorkerOptions.workerSrc = './vendor/pdfjs/pdf.worker.min.mjs';

    const params = new URLSearchParams(location.search);
    const screen_ = params.get('screen') || '1';
    const startNow = params.get('start') === 'now' ? Date.now() + 3000 : null;  // a test run, from this page's opening
    const TICK_MS = 250;
    const RELOAD_MS = 3000;
    const PRELOAD_S = 20;  // the next poster loads this long before its turn
    const $ = (id) => document.getElementById(id);
    const slots = [...document.querySelectorAll('.slot')];
    let plan, start, shownKey = '', drawnTimetable = '';

    const paperOf = (uid) => plan.papers[uid] || { title: Kit.code(uid), authors: '' };

    // The first page, as large as the stage holds it, at the screen's own resolution.
    async function drawPdf(slot, uid, url) {
      const pdf = await pdfjs.getDocument(url).promise;
      const page = await pdf.getPage(1);
      const plain = page.getViewport({ scale: 1 });
      const scale = Math.min(slot.clientWidth / plain.width, slot.clientHeight / plain.height);
      const viewport = page.getViewport({ scale: scale * (window.devicePixelRatio || 1) });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      pdf.destroy();
      if (slot.dataset.uid === uid) slot.replaceChildren(canvas);  // still wanted here
    }

    function load(slot, uid) {
      if (slot.dataset.uid === uid) return;
      slot.dataset.uid = uid;
      const poster = (plan.media[uid] || {}).poster;
      const paper = paperOf(uid);
      const fallback = `<div class="fallback"><h2>${Kit.esc(paper.title)}</h2><p>${Kit.esc(paper.authors)}</p></div>`;
      if (!poster) {
        slot.innerHTML = fallback;
      } else if (poster.endsWith('.pdf')) {
        slot.innerHTML = '';
        drawPdf(slot, uid, poster).catch(() => { if (slot.dataset.uid === uid) slot.innerHTML = fallback; });
      } else {
        slot.innerHTML = `<img src="${poster}" alt="">`;
      }
    }

    function showPoster(index) {
      const uid = plan.plays[index];
      let slot = slots.find((candidate) => candidate.dataset.uid === uid);
      if (!slot) {
        slot = slots.find((candidate) => !candidate.classList.contains('on')) || slots[0];
        load(slot, uid);
      }
      slots.forEach((candidate) => candidate.classList.toggle('on', candidate === slot));
      if (shownKey === `${index}:${uid}`) return;  // a reorder can put another poster at the same place
      shownKey = `${index}:${uid}`;
      const paper = paperOf(uid);
      const next = plan.plays[index + 1];
      $('code').textContent = Kit.code(uid);
      $('title').textContent = paper.title;
      $('authors').textContent = paper.authors;
      const card = (label, image, channel) => (image ? `<div class="qr"><img src="${image}" alt="">
        <b>${label}</b><span>#${Kit.esc(channel)}</span></div>` : '');
      $('channels').innerHTML = card('Paper channel', (plan.media[uid] || {}).channel, paper.slack) +
        card('Group channel', (plan.media[`g${paper.group}`] || {}).channel, (plan.group_slack || {})[paper.group]);
      $('next').innerHTML = next ? `<b>NEXT</b><div>${Kit.code(next)} · ${Kit.esc(paperOf(next).title)}</div>` : '';
    }

    function drawTimetable() {
      const key = [start, plan.poster_s, plan.plays.join()].join();
      if (drawnTimetable === key) return;
      drawnTimetable = key;
      $('tt-title').textContent = plan.name;
      const groups = [];
      plan.plays.forEach((uid, index) => {
        const group = paperOf(uid).group;
        if (!groups.length || groups[groups.length - 1].group !== group) groups.push({ group, items: [] });
        groups[groups.length - 1].items.push({ uid, at: start + index * plan.poster_s * 1000 });
      });
      $('rows').innerHTML = groups.map(({ group, items }) => `<div class="group"><h2>${Kit.esc(plan.groups[group] || `Group ${group}`)}</h2>
        <div class="chips">${items.map(({ uid, at }) => `<span class="chip"><time>${Kit.clock(at, plan.timezone)}</time>${Kit.code(uid)}</span>`).join('')}</div></div>`).join('');
      const rows = $('rows');
      for (let size = 3.2; size >= 1.4; size -= 0.1) {  // as large as fits
        rows.style.fontSize = `${size}vh`;
        if (rows.scrollHeight <= rows.clientHeight) break;
      }
    }

    function show(layer) {
      ['card', 'timetable'].forEach((id) => $(id).classList.toggle('shown', id === layer));
    }

    function tick() {
      const elapsed = (Date.now() - start) / 1000;
      const total = plan.plays.length * plan.poster_s;
      if (elapsed < 0) {
        drawTimetable();
        show('timetable');
        $('tt-sub').textContent = `Starts in ${Kit.countdown(Math.ceil(-elapsed))}`;
        if (plan.plays.length) load(slots[0], plan.plays[0]);
        return;
      }
      if (elapsed >= total) {
        $('card-title').textContent = plan.name;
        $('card-text').textContent = 'All posters have shown. Thank you!';
        show('card');
        return;
      }
      show(null);
      const index = Math.floor(elapsed / plan.poster_s);
      const offset = elapsed - index * plan.poster_s;
      showPoster(index);
      const next = plan.plays[index + 1];
      if (next && plan.poster_s - offset < PRELOAD_S) load(slots.find((slot) => !slot.classList.contains('on')), next);
      $('time').textContent = `${Kit.duration(offset)} / ${Kit.duration(plan.poster_s)}`;
      document.body.style.setProperty('--done', offset / plan.poster_s);
    }

    async function reload() {
      plan = await Kit.get(`/api/lbd/P${screen_}`);
      start = startNow || plan.start_ms;
    }

    let idleTimer;
    function wake() {
      document.body.classList.remove('idle');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => document.body.classList.add('idle'), 4000);
    }
    document.addEventListener('mousemove', wake);
    document.addEventListener('keydown', (event) => {
      if (event.key.toLowerCase() !== 'f') return;
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    });
    document.addEventListener('dblclick', () => document.documentElement.requestFullscreen());

    (async () => {
      wake();
      await reload();
      setInterval(tick, TICK_MS);
      setInterval(() => reload().catch(() => {}), RELOAD_MS);
      if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {});
    })();
  </script>
</body>
</html>
