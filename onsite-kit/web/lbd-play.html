<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LBD player</title>
  <style>
    /* The look of ismir2026.ismir.net and its program site: white, ink, and the logo's gold. */
    :root { --gold: #b47500; --gold-light: #f8c44f; --gold-tint: #fdf4e1; --ink: #161616; --soft: #5b5b5b; --line: #e8e8e8; --page: #f9fafb; }
    html, body { margin: 0; height: 100%; background: var(--page); color: var(--ink); overflow: hidden;
      font-family: Poppins, "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
    body.idle { cursor: none; }
    .layer { position: fixed; inset: 0; visibility: hidden; display: flex; flex-direction: column; }
    .layer.shown { visibility: visible; }
    /* Hidden layers stay rendered under the timetable, so a poster is ready when its turn comes. */
    #poster, #video-layer { visibility: visible; }
    #poster { background: #fff; }
    #video-layer { background: var(--ink); opacity: 0; }
    #video-layer.shown { opacity: 1; }
    .stage { position: relative; flex: 1; min-height: 0; }
    .stage iframe, .stage img, .stage video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: contain; }
    .fallback { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 10vw; text-align: center; }
    .fallback h2 { font-size: 5vh; margin: 0 0 2vh; }
    .fallback p { font-size: 2.6vh; color: var(--soft); margin: 0; }

    /* The row above a poster or a video: whose it is, how far it has played, and what plays next. */
    .bar { flex: none; display: flex; align-items: center; gap: 2vw; padding: 1.2vh 2vw; background: var(--ink); color: #fff; }
    .mark { flex: none; font-size: 3.2vh; font-weight: 700; letter-spacing: .06em; }
    .mark span { margin-left: .6em; color: var(--gold-light); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
    .next { flex: 1; min-width: 0; display: flex; align-items: center; border-radius: 1vh; background: #ffffff17;
      font-size: 2.6vh; font-weight: 600; white-space: nowrap; overflow: hidden; }
    .next div { flex: 1; overflow: hidden; padding: 1vh 0; margin: 0 1.2vw; }
    .next span { display: inline-block; padding-left: 100%; animation: ticker var(--scroll, 20s) linear infinite; }
    .next b { color: var(--gold-light); letter-spacing: .12em; margin-right: .6em; }
    .next i { display: inline-block; width: 4em; }
    @keyframes ticker { to { transform: translateX(-100%); } }
    .logo { flex: none; mix-blend-mode: multiply; }  /* the logo file has a white background */
    .progress { position: absolute; left: 0; bottom: 0; z-index: 1; height: .5vh; width: 100%; background: var(--gold-light);
      transform-origin: left; transform: scaleX(var(--done, 0)); }

    /* The timetable before the start: the first round in full, later rounds as codes only. */
    #timetable { padding: 4vh 4vw 3vh; z-index: 2; background: var(--page); }
    /* At the start the timetable stays under the first cover until that has faded in. */
    #timetable { transition: visibility 0s linear .8s; }
    #timetable.shown { transition: none; }
    .top { display: flex; align-items: center; gap: 2vw; padding-bottom: 2vh; margin-bottom: 2vh; border-bottom: .35vh solid var(--gold); }
    .top .logo { height: 9vh; }
    .eyebrow { font-size: 1.9vh; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
    #tt-title { font-size: 4vh; font-weight: 800; margin: .3vh 0; line-height: 1.15; }
    #tt-sub { font-size: 2.3vh; color: var(--gold); font-variant-numeric: tabular-nums; }
    /* Sized in em: drawTimetable shrinks #rows' font until the whole timetable fits. */
    #rows { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: .23em; overflow: hidden; }
    .row { display: flex; align-items: center; gap: .55em; min-width: 0; padding: .22em .45em; border-radius: .3em; background: #fff;
      border-left: .5vh solid #e6cf9f; box-shadow: 0 .1vh .3vh #0000000d; }
    .row time, .chip time { flex: none; font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; }
    .row .code { flex: none; min-width: 5.4em; color: var(--soft); font-size: .85em; font-weight: 600; font-variant-numeric: tabular-nums; }
    .row div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .round { margin-top: .5em; }
    .round h2 { margin: 0 0 .35em; font-size: .72em; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
    .chips { display: flex; flex-wrap: wrap; gap: .25em .3em; }
    .chip { padding: .2em .4em; border-radius: .3em; background: #fff; border-left: .4vh solid #e6cf9f; font-size: .88em;
      font-weight: 600; font-variant-numeric: tabular-nums; box-shadow: 0 .1vh .3vh #0000000d; }
    .chip time { margin-right: .5em; }

    /* The cover before each video: code, title, authors and their affiliations. */
    #cover { justify-content: center; padding: 0 9vw; background: var(--page); z-index: 2; }
    /* The cover fades in over the faded-out video, and fades out over the next one as it starts. */
    #cover { opacity: 0; transition: opacity .8s ease, visibility 0s linear .8s, --cover-done .25s linear; }
    #cover.shown { opacity: 1; transition: opacity .8s ease, visibility 0s, --cover-done .25s linear; }
    #video { transition: opacity .25s linear; }
    #video-mark { transition: opacity .4s ease; }
    #cover .logo { position: absolute; top: 5vh; left: 9vw; height: 9vh; }
    /* A faint ring in the top right corner fills as the cover's time runs out. */
    @property --cover-done { syntax: '<number>'; inherits: true; initial-value: 0; }
    #cover .ring { position: absolute; top: 5vh; right: 4vw; width: 7vh; height: 7vh; border-radius: 50%; opacity: .45;
      background: conic-gradient(var(--gold) calc(var(--cover-done) * 1turn), var(--line) 0);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - .8vh), #000 calc(100% - .8vh + 1px));
      mask: radial-gradient(farthest-side, transparent calc(100% - .8vh), #000 calc(100% - .8vh + 1px)); }
    #cover .eyebrow { font-size: 3vh; margin-bottom: 2.5vh; }
    #cover h1 { font-size: 6vh; line-height: 1.2; margin: 0 0 4vh; padding-bottom: 3vh; border-bottom: .35vh solid var(--gold); }
    #cover .authors { font-size: 3.2vh; line-height: 1.5; font-weight: 600; }
    #cover .affiliations { margin-top: 2vh; font-size: 2.4vh; line-height: 1.6; color: var(--soft); }
    #cover sup { font-size: .6em; color: var(--gold); margin-left: .1em; }
    .cover-body { display: flex; align-items: center; gap: 5vw; }
    .cover-text { flex: 1; min-width: 0; }
    /* The paper's and the group's Slack channels, as cards of QR codes. */
    .channels { flex: none; display: flex; flex-direction: column; gap: 2.4vh; }
    #cover .channels .eyebrow { margin: 0; font-size: 2vh; text-align: center; }
    .qr { width: 25vh; padding: 1.6vh 1.6vh 1.5vh; border-radius: 1.6vh; background: #fff; border-top: .6vh solid var(--gold);
      box-shadow: 0 .8vh 2.4vh #0000001f; text-align: center; }
    .qr img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; object-position: top; }  /* drops the printed name */
    .qr b { display: block; margin-top: .6vh; font-size: 1.6vh; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
    .qr span { display: block; margin-top: .3vh; font-size: 1.7vh; font-weight: 600; overflow-wrap: anywhere; }

    #card { align-items: center; justify-content: center; text-align: center; background: var(--page); z-index: 2; }
    #card .logo { height: 16vh; margin-bottom: 3.5vh; }
    #card h1 { max-width: 80vw; font-size: 5vh; line-height: 1.2; margin: 0 0 2vh; }
    #card p { font-size: 3vh; color: var(--soft); margin: 0; }
    #card-channel { margin-top: 4vh; display: flex; flex-direction: column; align-items: center; gap: 1.6vh; }
    #card-channel:empty { display: none; }
    #card-channel .eyebrow { font-size: 2vh; }
    #card .card-eyebrow { font-size: 2.4vh; margin-bottom: 1.6vh; }
    #hint { position: fixed; z-index: 3; right: 1.5vw; bottom: 1.5vh; padding: .6vh 1vw; background: #161616cc; border-radius: 99px;
      font-size: 1.7vh; color: #fff; transition: opacity .4s; }
    body.idle #hint { opacity: 0; }
  </style>
</head>
<body>
  <div class="layer" id="poster"></div>
  <div class="layer" id="video-layer">
    <div id="video-mark"></div>
    <div class="stage"><video id="video" playsinline preload="auto" muted></video></div>
  </div>
  <div class="layer" id="timetable">
    <div class="top">
      <img class="logo" src="logo.png" alt="ISMIR 2026">
      <div><div class="eyebrow">Late-Breaking / Demo</div><h1 id="tt-title"></h1><div id="tt-sub"></div></div>
    </div>
    <div id="rows"></div>
  </div>
  <div class="layer" id="cover"></div>
  <div class="layer shown" id="card"><img class="logo" src="logo.png" alt="ISMIR 2026"><div class="eyebrow card-eyebrow">Late-Breaking / Demo</div><h1 id="card-title">Loading…</h1><p id="card-text"></p><div id="card-channel"></div></div>
  <div id="hint">F fullscreen · M sound: off</div>
  <script src="kit.js"></script>
  <script src="lbd-timeline.js"></script>
  <script>
    const screen_ = new URLSearchParams(location.search).get('screen') || '1';
    const TICK_MS = 250;
    const FADE_OUT_S = 1.2;  // the end of each video fades to dark, sound too
    const RELOAD_MS = 3000;
    const DRIFT_S = 1.2;
    const $ = (id) => document.getElementById(id);
    const video = $('video');
    let plan, timeline, prepared = '', unplayable = false, cardChannel = '';

    const paperOf = (item) => plan.papers[item.uid] || { title: `LBD ${item.uid}`, authors: '' };
    const code = Kit.code;
    // The bar on top: the paper's code and, for a video, how far it has played; and what plays next.
    const markHtml = (item, kind) => {
      const next = timeline.items[item.index + 1];
      const line = (label, it) => `<b>${label}</b>${code(it.uid)} · ${Kit.esc(paperOf(it).title)}`;
      const length = paperOf(item).title.length + (next ? paperOf(next).title.length + 40 : 0);
      return `<div class="bar"><div class="mark">${code(item.uid)}<span class="state">${kind === 'video' ? '' : 'POSTER'}</span></div>` +
        `<div class="next"><div><span style="--scroll:${10 + length * 0.18}s">${line('NOW', item)}` +
        `${next ? `<i></i>${line('NEXT', next)}` : ''}</span></div></div></div><i class="progress"></i>`;
    };
    // A Slack channel's QR code with its name, or nothing when this MacBook has no code for it.
    const qrCard = (label, image, channel) => (image ? `<div class="qr"><img src="${image}" alt="">
      <b>${label}</b><span>#${Kit.esc(channel)}</span></div>` : '');

    // Authors with a mark for each affiliation, numbered only when they differ.
    function coverHtml(item) {
      const paper = paperOf(item);
      const people = Array.isArray(paper.people) && paper.people.length ? paper.people : [[paper.authors, []]];
      const places = [...new Set(people.flatMap(([, own]) => own))];
      const marks = (own) => (places.length > 1 && own.length ? `<sup>${own.map((place) => places.indexOf(place) + 1).join(',')}</sup>` : '');
      const channels = qrCard('Paper channel', (plan.media[item.uid] || {}).channel, paper.slack) +
        qrCard('Group channel', (plan.media[`g${paper.group}`] || {}).channel, (plan.group_slack || {})[paper.group]);
      return `<img class="logo" src="logo.png" alt="ISMIR 2026"><div class="ring"></div><div class="cover-body"><div class="cover-text">
        <div class="eyebrow">${code(item.uid)}</div><h1>${Kit.esc(paper.title)}</h1>
        <div class="authors">${people.map(([name, own]) => `${Kit.esc(name)}${marks(own)}`).join(', ')}</div>
        <div class="affiliations">${places.map((place, index) => `${places.length > 1 ? `<sup>${index + 1}</sup> ` : ''}${Kit.esc(place)}`).join('<br>')}</div>
        </div>${channels ? `<div class="channels"><div class="eyebrow">Join on Slack</div>${channels}</div>` : ''}</div>`;
    }
    const atClock = (seconds) => Kit.clock(plan.start_ms + seconds * 1000, plan.timezone);

    function prepare(item) {
      const media = plan.media[item.uid] || {};
      // Not the revision: an edit further down the list must not reload what is on the wall.
      const key = [item.index, item.uid, media.video, media.poster, plan.problems[item.uid], plan.poster_s > 0].join();
      if (prepared === key) return;
      prepared = key;
      unplayable = Boolean(plan.problems[item.uid] || !media.video);
      const paper = paperOf(item);
      const poster = media.poster && plan.poster_s + (unplayable ? 1 : 0)
        ? (media.poster.endsWith('.pdf')
          ? `<iframe src="${media.poster}#toolbar=0&navpanes=0&scrollbar=0&view=Fit"></iframe>`
          : `<img src="${media.poster}" alt="">`)
        : `<div class="fallback"><h2>${Kit.esc(paper.title)}</h2><p>${Kit.esc(paper.authors)}</p></div>`;
      $('poster').innerHTML = markHtml(item, 'poster') + `<div class="stage">${poster}</div>`;
      $('video-mark').innerHTML = markHtml(item, 'video');
      $('cover').innerHTML = coverHtml(item);
      if (unplayable) {
        video.removeAttribute('src');
        video.load();
      } else {
        video.src = media.video;
        video.load();
      }
    }

    // A play's round is how many times its video has come up so far.
    let drawnTimetable = '';
    function drawTimetable() {
      const key = [plan.rev, plan.start_ms, timeline.items.length, innerHeight, innerWidth].join();
      if (drawnTimetable === key) return;
      drawnTimetable = key;
      $('tt-title').textContent = plan.theme;
      const seen = {};
      const rounds = [];
      timeline.items.forEach((item) => {
        seen[item.uid] = (seen[item.uid] || 0) + 1;
        (rounds[seen[item.uid] - 1] = rounds[seen[item.uid] - 1] || []).push(item);
      });
      $('rows').innerHTML = (rounds[0] || []).map((item) => `<div class="row"><time>${atClock(item.start)}</time>
        <span class="code">${code(item.uid)}</span><div>${Kit.esc(paperOf(item).title)}</div></div>`).join('') +
        rounds.slice(1).map((items, index) => `<div class="round"><h2>Play back${index ? ` ${index + 1}` : ''}</h2>
          <div class="chips">${items.map((item) => `<span class="chip"><time>${atClock(item.start)}</time>${code(item.uid)}</span>`).join('')}</div></div>`).join('');
      const rows = $('rows');
      for (let size = 2.8; size >= 1.4; size -= 0.1) {
        rows.style.fontSize = `${size}vh`;
        if (rows.scrollHeight <= rows.clientHeight) break;
      }
    }

    function show(layer) {
      ['card', 'timetable', 'cover'].forEach((id) => $(id).classList.toggle('shown', id === layer));
      $('video-layer').classList.toggle('shown', layer === 'video-layer');
    }

    // How far the poster or video on screen is through its time, for the bar along the bottom.
    function setProgress(from, to, elapsed) {
      document.body.style.setProperty('--done', Math.min(Math.max((elapsed - from) / (to - from || 1), 0), 1));
    }

    function syncVideo(position) {
      const hasVideo = Boolean(video.getAttribute('src'));
      if (!hasVideo) {
        $('video-layer').classList.remove('shown');  // the poster stays up instead
        video.pause();
        return;
      }
      if (video.seeking) return;
      if (Math.abs(video.currentTime - position.offset) > DRIFT_S && position.offset < (video.duration || Infinity)) {
        video.currentTime = position.offset;
      }
      if (video.paused && !video.ended) video.play().catch(() => {});
    }

    function tick() {
      const elapsed = (Date.now() - plan.start_ms) / 1000;
      const position = Timeline.locate(timeline, elapsed);
      if (position.phase === 'before') {
        prepare(position.item);
        video.style.opacity = 0;  // so the first video's opening frame never shows as the first cover fades in
        $('video-mark').style.opacity = 0;
        const wait = Math.ceil(-position.offset);
        drawTimetable();
        show('timetable');
        $('tt-sub').textContent = `Starts in ${Kit.countdown(wait)}`;
        return;
      }
      if (position.phase === 'done') {
        video.pause();
        $('card-title').textContent = plan.theme;
        $('card-text').textContent = 'All videos have played. Thank you!';
        const group = qrCard('Group channel', (plan.media[`g${plan.screen}`] || {}).channel, (plan.group_slack || {})[plan.screen]);
        const channel = group && `<div class="eyebrow">Continue the discussion on Slack</div>${group}`;
        if (cardChannel !== channel) {  // redrawn only on change, so the image does not reload
          cardChannel = channel;
          $('card-channel').innerHTML = channel;
        }
        show('card');
        return;
      }
      const { item, phase } = position;
      prepare(item);
      if (phase === 'timetable') {
        // The timetable phase is each video's cover now; the full timetable shows before the start.
        // The dark video layer stays under the cover, so it fades in from the faded-out video.
        show('cover');
        $('cover').style.setProperty('--cover-done', Math.min((elapsed - item.start) / (item.posterAt - item.start || 1), 1));
        $('video-layer').classList.add('shown');
        video.style.opacity = 0;
        $('video-mark').style.opacity = 0;
      } else if (phase === 'poster') {
        setProgress(item.posterAt, unplayable ? item.end : item.videoAt, elapsed);
        show('poster');
      } else {
        setProgress(unplayable ? item.posterAt : item.videoAt, item.end, elapsed);
        const state = $('video-mark').querySelector('.state');
        if (state) state.textContent = `${Kit.duration(Math.min(position.offset, item.end - item.videoAt))} / ${Kit.duration(item.end - item.videoAt)}`;
        const level = Math.max(0, Math.min(1, (item.end - elapsed) / FADE_OUT_S));
        video.style.opacity = level;
        video.volume = level;
        $('video-mark').style.opacity = 1;
        // The ring empties once the cover has faded out, so it never runs backwards in sight.
        if (position.offset > 1) $('cover').style.setProperty('--cover-done', 0);
        show('video-layer');
        syncVideo(position);
        return;
      }
      if (!video.paused) video.pause();
      if (video.currentTime) video.currentTime = 0;
    }

    async function reload() {
      plan = await Kit.get(`/api/lbd/${screen_}`);
      timeline = Timeline.build(plan);
    }

    function setHint() {
      $('hint').textContent = `F fullscreen · M sound: ${video.muted ? 'off' : 'on'}`;
    }

    let idleTimer;
    function wake() {
      document.body.classList.remove('idle');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => document.body.classList.add('idle'), 4000);
    }

    document.addEventListener('mousemove', wake);
    document.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      if (key === 'f') {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen();
      } else if (key === 'm') {
        video.muted = !video.muted;
        localStorage.setItem('lbd-sound', video.muted ? 'off' : 'on');
        setHint();
        wake();
      }
    });
    document.addEventListener('dblclick', () => document.documentElement.requestFullscreen());

    (async () => {
      video.muted = localStorage.getItem('lbd-sound') !== 'on';
      setHint();
      wake();
      await reload();
      setInterval(tick, TICK_MS);
      setInterval(() => reload().catch(() => {}), RELOAD_MS);
      if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {});
    })();
  </script>
</body>
</html>
